services:
  mongodb:
    image: mongo:latest
    container_name: shared-mongo
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    volumes:
      - mongo-data:/data/db

  user-service:
    build: ./user-service
    container_name: user-service
    # Maps Ubuntu port 3001 to Container port 3001 (matching your .env)
    ports:
      - "2024:2024" 
    depends_on:
      - mongodb

  order-service:
    build: ./order-service
    container_name: order-service
    ports:
      - "2026:2026"
    depends_on:
      - mongodb

  product-service:
    build: ./product-service
    container_name: product-service
    ports:
      - "2025:2025"
    depends_on:
      - mongodb

volumes:
  mongo-data: